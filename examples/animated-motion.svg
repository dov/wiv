<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="200">
  <path id="track" d="M20,150 C100,20 200,20 280,150 S380,150 380,100" fill="none" stroke="#888" stroke-dasharray="4 4"/>
  <!-- arrow that follows the track and points along it -->
  <polygon points="-12,-8 12,0 -12,8" fill="#ffa500">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
      <mpath xlink:href="#track"/>
    </animateMotion>
  </polygon>
  <!-- same track, eased out via keyPoints/keyTimes -->
  <circle r="7" fill="#40c0ff">
    <animateMotion dur="5s" repeatCount="indefinite" path="M20,150 C100,20 200,20 280,150 S380,150 380,100"
                   keyPoints="0;0.8;1" keyTimes="0;0.2;1" calcMode="linear"/>
  </circle>
</svg>
