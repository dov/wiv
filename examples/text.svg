<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360">
  <rect width="500" height="360" fill="#fffbe8"/>
  <!-- guide lines for the anchors -->
  <path d="M250,10 V120 M10,40 H490" stroke="#c88" stroke-width="1" fill="none"/>
  <g font-family="Verdana, sans-serif" font-size="22">
    <text x="250" y="40" text-anchor="start" fill="#c00">start</text>
    <text x="250" y="70" text-anchor="middle" fill="#080">middle</text>
    <text x="250" y="100" text-anchor="end" fill="#00c">end</text>
  </g>
  <text x="20" y="150" font-family="serif" font-size="30" font-weight="bold" font-style="italic">Bold italic serif</text>
  <text x="20" y="190" style="font-family:monospace;font-size:18px;fill:#555">monospace, style="..."</text>
  <text x="20" y="230" font-size="20">One line,
    <tspan x="20" dy="26" fill="#a0a">then a tspan on the next line</tspan></text>
  <!-- rotated and scaled text -->
  <text x="0" y="0" font-size="24" fill="#066" transform="translate(380 330) rotate(-30)">rotated -30</text>
  <g transform="scale(2)"><text x="10" y="165" font-size="10" fill="#c60">scaled x2</text></g>
  <!-- text that moves -->
  <text x="20" y="285" font-size="24" fill="#222">It's SVG!
    <animateMotion path="M0,0 q60,40 100,0 q60,-40 100,0" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
